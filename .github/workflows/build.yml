name: build & run tests

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # `dune fmt` builds the ocamlformat dev tool, which loads the OCaml
      # compiler inside a force-sandboxed action (so --sandbox/DUNE_SANDBOX are
      # ignored). That sandbox copies the compiler binaries but not the sibling
      # lib/ocaml/Makefile.config, so the load dies with "Makefile.config: No
      # such file or directory". Enabling toolchains builds the compiler in the
      # shared ~/.cache/dune/toolchains cache, which dune reads directly instead
      # of sandbox-copying, sidestepping the bug. See ocaml/dune#10316.
      DUNE_CONFIG__TOOLCHAINS: enabled

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set up dune
        uses: ocaml-dune/setup-dune@v2

      - run: dune tool install ocamlformat

      - run: dune fmt

      - run: dune build

      - run: dune runtest
