name: build & run tests

on:
  - push
  - pull_request

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      # Pin to the latest stable dune instead of setup-dune's default (nightly).
      # On nightly, `dune fmt` (and `dune build @doc` in odoc.yaml) crash: they
      # load the OCaml compiler inside a force-sandboxed action whose sandbox
      # omits lib/ocaml/Makefile.config, so the load fails with "Makefile.config:
      # No such file or directory". No nightly config/env escapes it (the sandbox
      # is forced; nightly has no toolchains feature). Stable builds the compiler
      # in the shared toolchains cache, which is read directly, avoiding the bug.
      - name: Set up dune
        uses: ocaml-dune/setup-dune@v2
        with:
          version: latest

      - run: dune tool install ocamlformat

      - run: dune fmt

      - run: dune build

      - run: dune runtest
