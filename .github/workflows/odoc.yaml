name: publish odoc

on:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: deploy-odoc
  cancel-in-progress: true

jobs:
  deploy-odoc:
    runs-on: ubuntu-latest
    env:
      # Without this, `dune build @doc` fails to find the odoc installed by
      # `dune tool install` ("Program odoc not found in the tree or in PATH").
      # See ocaml/dune#14235.
      DUNE_CONFIG__LOCK_DEV_TOOL: enabled
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Pin to the latest stable dune instead of setup-dune's default (nightly),
      # which crashes the dev-tool compiler load with a missing Makefile.config
      # inside a forced sandbox. See build.yml for the full explanation.
      - name: Set up dune
        uses: ocaml-dune/setup-dune@v2
        with:
          version: latest
          steps: install-dune enable-pkg lazy-update-depexts install-gpatch install-depexts build-deps

      - run: dune tool install odoc

      - run: dune build @doc

      - name: Set-up Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/default/_doc/_html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
